{% extends 'base.html' %}

{% block title %}Editar Operador - Velpack{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 fw-bold">Modificar Datos de Operador</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted">Nombres</label>
                                <input type="text" name="first_name" class="form-control" value="{{ nombre }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-muted">Apellidos</label>
                                <input type="text" name="last_name" class="form-control" value="{{ apellido }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Cédula de Identidad</label>
                            <input type="text" name="cedula" class="form-control" value="{{ operador.cedula }}" required>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" name="activo" id="estadoCheck" {% if operador.activo %}checked{% endif %}>
                            <label class="form-check-label fw-bold" for="estadoCheck">Operador Activo para Turnos</label>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success px-4">Guardar Cambios</button>
                            <a href="{% url 'lista_usuarios' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
