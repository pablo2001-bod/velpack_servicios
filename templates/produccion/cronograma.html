{% extends 'base.html' %}

{% block title %}
Cronograma de Producción - Velpack
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h3 class="fw-bold mb-1 text-success">Cronograma de Producción</h3>
                    </div>
                </div>

                <!-- IMPORTANTE: method="POST" sin validaciones complejas anteriores -->
                <form method="POST" autocomplete="off">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label fw-bold fs-5 text-dark mb-3">Modelos Disponibles:</label>
                        <div class="row g-3">
                            {% for prod in productos %}
                                {% if "segunda" not in prod.nombre|lower %}
                                <div class="col-md-6">
                                    <div class="p-3 border rounded-3 bg-light shadow-sm d-flex align-items-center justify-content-between">
                                        <span class="fw-bold fs-5 text-secondary">{{ prod.nombre }}</span>
                                        <div class="form-check form-switch fs-4">
                                            <!-- El name debe ser exactamente productos_activos[] -->
                                            <input class="form-check-input" type="checkbox" name="productos_activos[]" value="{{ prod.id }}" id="prod_{{ prod.id }}" 
                                                {% if prod.id in productos_seleccionados_ids %}checked{% endif %}>
                                        </div>
                                    </div>
                                </div>
                                {% endif %}
                            {% endfor %}
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-4">
                        <a href="{% url 'produccion:lista' %}" class="btn btn-secondary px-4 fw-bold">Cancelar</a>
                        <button type="submit" class="btn btn-success px-5 fw-bold fs-5">Guardar Cronograma</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
