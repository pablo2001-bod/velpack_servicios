<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Operador - Velpack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .btn-success-velpack {
            background-color: #198754;
            border-color: #198754;
            font-size: 1.1rem;
        }
        .btn-success-velpack:hover {
            background-color: #157347;
            border-color: #146c43;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 d-flex justify-content-center">
                <div class="card login-card p-4 bg-white">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-success mb-0">VELPACK</h3>
                        <p class="text-muted small">Terminal de Planta de Producción</p>
                        <h5 class="fw-semibold text-dark mt-3"><i class="bi bi-person-badge me-2"></i>Ingrese su Cédula o Código</h5>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger py-2 small text-center" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label for="cedula" class="form-label small fw-bold text-muted">Cédula o Código de Operador</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
                                <input type="text" name="cedula" autofocus autocomplete="off" required class="form-control" id="cedula" placeholder="Ej: Cédula o JT0488">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success-velpack py-3 fw-bold text-white shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Turno
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">© 2026 Velpack - Sistema de Inventario</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
