<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Operador | Velpack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at 15% 15%, rgba(67, 160, 71, .28), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(27, 94, 32, .35), transparent 45%),
                #0f2e1a;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 34px;
            border: 0;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .3);
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, #1B5E20, #43A047);
            color: #fff;
            font-size: 1.7rem;
            font-weight: 800;
            box-shadow: 0 10px 22px rgba(27, 94, 32, .3);
        }
        .brand-title {
            margin: 0;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: .16em;
            color: #1B5E20;
        }
        .brand-sub {
            margin: 3px 0 0;
            color: #64748b;
            font-size: .82rem;
        }
        .login-title {
            margin: 26px 0 6px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
        }
        .login-help {
            margin-bottom: 20px;
            color: #64748b;
            font-size: .82rem;
        }
        .form-control {
            height: 56px;
            border-radius: 0 12px 12px 0;
            font-size: 1.1rem;
        }
        .input-group-text {
            border-radius: 12px 0 0 12px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 1.15rem;
        }
        .input-group:focus-within .input-group-text {
            background: #e8f5e9;
            color: #1B5E20;
        }
        .btn-ingresar {
            height: 56px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
            box-shadow: 0 10px 22px rgba(27, 94, 32, .25);
        }
        .btn-ingresar:hover { color: #fff; filter: brightness(1.05); }
        .login-footer {
            margin-top: 22px;
            text-align: center;
            color: #94a3b8;
            font-size: .74rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <div class="brand-mark">V</div>
            <h1 class="brand-title">VELPACK</h1>
            <p class="brand-sub">Terminal de producción</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-2 small text-center mt-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label  for="cedula" class="form-label small fw-bold text-muted text-uppercase">
            Usa tu código de operador.
                </label>
                <div class="input-group input-group-lg">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text"
                           name="cedula"
                           id="cedula"
                           class="form-control"
                           placeholder="Ej: 0102030405 o AR0405"
                           autofocus
                           autocomplete="off"
                           inputmode="text"
                           required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-ingresar">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar turno
                </button>
            </div>
        </form>

        <div class="login-footer">
            2026 Velpack 
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
