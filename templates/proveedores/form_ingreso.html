{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-truck-loading me-2"></i> Registrar Ingreso de Materia Prima
                    </h5>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        {{ form.non_field_errors }}

                        <div class="mb-3">
                            <label class="form-label fw-bold">Proveedor</label>
                            {{ form.proveedor }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Material</label>
                            {{ form.tipo_material }}
                        </div>

                        <!-- Sección exclusiva para Tintes (Unidades) -->
                        <div class="mb-3" id="seccion-cantidad">
                            <label class="form-label fw-bold">Cantidad</label>
                            {{ form.cantidad }}
                            <div class="form-text text-muted">Colorante.</div>
                        </div>

                        <!-- Sección exclusiva para Cartón / Dúplex (Báscula) -->
                        <div class="row" id="seccion-bascula">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Peso Cargado (Báscula)</label>
                                {{ form.peso_cargado }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Peso Vacío (Báscula)</label>
                                {{ form.peso_vacio }}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Observaciones</label>
                            {{ form.observacion }}
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'proveedores:lista_ingresos' %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Guardar Ingreso</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script dinámico para mostrar u ocultar campos según el material -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const selectTipo = document.getElementById("id_tipo_material");
        const seccionCantidad = document.getElementById("seccion-cantidad");
        const seccionBascula = document.getElementById("seccion-bascula");

        function actualizarCampos() {
            const valor = selectTipo.value;
            if (valor === "CARTON" || valor === "DUPLEX") {
                seccionBascula.style.display = "flex";
                seccionCantidad.style.display = "none";
            } else {
                seccionBascula.style.display = "none";
                seccionCantidad.style.display = "block";
            }
        }

        selectTipo.addEventListener("change", actualizarCampos);
        actualizarCampos(); // Ejecutar al cargar
    });
</script>
{% endblock %}
